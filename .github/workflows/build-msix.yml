name: Build MSIX Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-msix:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download EXE
      shell: powershell
      run: Invoke-WebRequest -Uri "https://plssem.com/DataAnalysisRobot.exe" -OutFile "DataAnalysisRobot.exe"

    - name: Create AppxManifest
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "PackageLayout\assets"
        $xml = '<?xml version="1.0" encoding="utf-8"?>'
        $xml += '<Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10" xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10" xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities">'
        $xml += '<Identity Name="Dr.YavuzTORAMANplssem.com.52549E25D594D" Publisher="CN=40D7BF6A-4C55-4114-A753-7294568B0BDE" Version="1.0.0.0" ProcessorArchitecture="x64"/>'
        $xml += '<Properties><DisplayName>Data Analysis Robot (plssem.com)</DisplayName><PublisherDisplayName>Dr. Yavuz TORAMAN (plssem.com)</PublisherDisplayName><Logo>assets\logo.png</Logo></Properties>'
        $xml += '<Dependencies><TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.22621.0"/></Dependencies>'
        $xml += '<Resources><Resource Language="en-US"/></Resources>'
        $xml += '<Applications><Application Id="DataAnalysisRobot" Executable="DataAnalysisRobot.exe" EntryPoint="Windows.FullTrustApplication"><uap:VisualElements DisplayName="Data Analysis Robot (plssem.com)" Description="Free AI-powered PLS-SEM" BackgroundColor="transparent" Square150x150Logo="assets\logo.png" Square44x44Logo="assets\logo44.png"/></Application></Applications>'
        $xml += '<Capabilities><rescap:Capability Name="runFullTrust"/></Capabilities>'
        $xml += '</Package>'
        $xml | Out-File -FilePath "PackageLayout\AppxManifest.xml" -Encoding UTF8
        Copy-Item "DataAnalysisRobot.exe" "PackageLayout\"
        $bytes = [Convert]::FromBase64String("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==")
        [IO.File]::WriteAllBytes("PackageLayout\assets\logo.png", $bytes)
        [IO.File]::WriteAllBytes("PackageLayout\assets\logo44.png", $bytes)

    - name: Pack MSIX
      shell: powershell
      run: |
        $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "makeappx.exe" | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1 -ExpandProperty FullName
        Write-Host "MakeAppx path: $makeappx"
        & $makeappx pack /d PackageLayout /p DataAnalysisRobot.msix /nv

    - name: Upload MSIX artifact
      uses: actions/upload-artifact@v4
      with:
        name: DataAnalysisRobot-msix
        path: DataAnalysisRobot.msix
