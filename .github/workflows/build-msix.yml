name: Build MSIX Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-msix:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download EXE
      shell: powershell
      run: Invoke-WebRequest -Uri "https://plssem.com/DataAnalysisRobot.exe" -OutFile "DataAnalysisRobot.exe"

    - name: Create AppxManifest
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "PackageLayout\Assets"
        # Sürüm tek kaynaktan: version.py (örn. 1.0.2 -> 1.0.2.0)
        $ver = ((Select-String -Path "version.py" -Pattern 'VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value) + ".0"
        Write-Host "Paket sürümü: $ver"
        $xml = '<?xml version="1.0" encoding="utf-8"?>'
        $xml += '<Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10" xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10" xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities">'
        $xml += '<Identity Name="Dr.YavuzTORAMANplssem.com.52549E25D594D" Publisher="CN=40D7BF6A-4C55-4114-A753-7294568B0BDE" Version="' + $ver + '" ProcessorArchitecture="x64"/>'
        $xml += '<Properties><DisplayName>Data Analysis Robot (plssem.com)</DisplayName><PublisherDisplayName>Dr. Yavuz TORAMAN (plssem.com)</PublisherDisplayName><Logo>Assets\StoreLogo.png</Logo></Properties>'
        $xml += '<Dependencies><TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.22621.0"/></Dependencies>'
        $xml += '<Resources><Resource Language="en-US"/><Resource Language="tr-TR"/></Resources>'
        $xml += '<Applications><Application Id="DataAnalysisRobot" Executable="DataAnalysisRobot.exe" EntryPoint="Windows.FullTrustApplication"><uap:VisualElements DisplayName="Data Analysis Robot (plssem.com)" Description="Free AI-powered PLS-SEM" BackgroundColor="#FFFFFF" Square150x150Logo="Assets\Square150x150Logo.png" Square44x44Logo="Assets\Square44x44Logo.png"/></Application></Applications>'
        $xml += '<Capabilities><rescap:Capability Name="runFullTrust"/></Capabilities>'
        $xml += '</Package>'
        $xml | Out-File -FilePath "PackageLayout\AppxManifest.xml" -Encoding UTF8
        Copy-Item "DataAnalysisRobot.exe" "PackageLayout\"
        # Gerçek simge seti (repo'daki msix_assets klasöründen)
        Copy-Item "msix_assets\*.png" "PackageLayout\Assets\"
        Get-ChildItem "PackageLayout\Assets" | Measure-Object | ForEach-Object { Write-Host "Simge sayısı: $($_.Count)" }

    - name: Build resources.pri
      shell: powershell
      run: |
        $makepri = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "makepri.exe" | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1 -ExpandProperty FullName
        Write-Host "MakePri path: $makepri"
        & $makepri createconfig /cf priconfig.xml /dq en-US_tr-TR /o
        & $makepri new /pr PackageLayout /cf priconfig.xml /mn PackageLayout\AppxManifest.xml /of PackageLayout\resources.pri /o

    - name: Pack MSIX
      shell: powershell
      run: |
        $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "makeappx.exe" | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1 -ExpandProperty FullName
        Write-Host "MakeAppx path: $makeappx"
        & $makeappx pack /d PackageLayout /p DataAnalysisRobot.msix /nv

    - name: Upload MSIX artifact
      uses: actions/upload-artifact@v4
      with:
        name: DataAnalysisRobot-msix
        path: DataAnalysisRobot.msix
